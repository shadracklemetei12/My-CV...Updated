<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Shadrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="contact">
        <h2>Contact Me</h2>

        <form action="https://formspree.io/f/xjgzjqyq" method="POST">
            <input type="hidden" name="_next" value="index.html">

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Your Name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Your Phone Number">

            <label>Project Type</label>
            <select name="project">
                <option>Website Development</option>
                <option>Website Design</option>
                <option>Bug Fix</option>
                <option>Collaboration</option>
            </select>

            <label>Budget</label>
            <input type="text" name="budget" placeholder="Estimated budget">

            <label>Message</label>
            <textarea name="message" rows="5" placeholder="Tell me about your project"></textarea>

            <button type="submit" id="submit-btn">Send Message</button>

        </form>

        <div id="form-status" style="margin-top: 20px; font-weight: 500; text-align: center;"></div>

        <script>
            const form = document.querySelector('form');
            const status = document.getElementById('form-status');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';
                status.textContent = 'Sending your message...';
                status.style.color = '#333';

                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        status.textContent = 'Success! Redirecting back to CV...';
                        status.style.color = 'green';
                        form.reset();
                        
                        // Wait a moment for the user to see the success message
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        const data = await response.json();
                        if (data.errors) {
                            status.textContent = data.errors.map(error => error.message).join(", ");
                        } else {
                            status.textContent = 'Oops! There was a problem submitting your form';
                        }
                        status.style.color = 'red';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Send Message';
                    }
                } catch (error) {
                    status.textContent = 'Oops! There was a problem submitting your form';
                    status.style.color = 'red';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Message';
                }
            });
        </script>
    </section>
</body>

</html>
